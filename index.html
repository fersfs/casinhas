<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogo Pixel Art</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div id="game-world" class="locked"> 
            
            <img id="panda" class="character" src="assets/panda.png" alt="Personagem Panda">
            
        </div>
        
        <div id="controls">
            <button id="arrow-left" class="control-button">
                <img src="assets/arrow-default-left.png" alt="Seta Esquerda">
            </button>
            <button id="arrow-right" class="control-button">
                <img src="assets/arrow-default-right.png" alt="Seta Direita">
            </button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
